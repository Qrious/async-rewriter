services:
  neo4j:
    image: neo4j:5
    container_name: async-rewriter-neo4j
    ports:
      - "7474:7474"   # HTTP (Browser)
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/asyncrewriter
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
